[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-auto"
version = "0.2.0"
description = "Open, auditable decision engine for vehicle acquisition"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "GLASSBOX-AUTO contributors"}]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
