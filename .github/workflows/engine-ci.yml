name: engine-ci

on:
  push:
    branches: [main, "build/**", "validation/**", "hardening/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  core-contracts:
    name: "contracts / core engine"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and pinned test runner
        run: python -m pip install -e . pytest==9.1.1
      - name: Run core contract tests
        run: >-
          pytest -ra --tb=short
          tests/test_engine.py
          tests/test_decision_critical_gates.py
          tests/test_must_have_weight.py
          tests/test_adversarial_final.py
          tests/test_adversarial_round2.py
      - name: Explain failure class
        if: failure()
        run: |
          echo "## CI failure: core engine contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "A scoring, gate, evidence, economics or adversarial core invariant failed." >> "$GITHUB_STEP_SUMMARY"
          echo "Open the **Run core contract tests** step; pytest uses short tracebacks and failed-test summaries." >> "$GITHUB_STEP_SUMMARY"

  historical-compatibility:
    name: "contracts / recovered v3 compatibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and pinned test runner
        run: python -m pip install -e . pytest==9.1.1
      - name: Run recovered-v3 and parity tests
        run: >-
          pytest -ra --tb=short
          tests/test_recovered_v3_semantics.py
          tests/test_v3_compat.py
          tests/test_v3_economics_fixture.py
          tests/test_v3_gate_parity.py
          tests/test_v3_offer_parity.py
          tests/test_v3_parity_report.py
          tests/test_v3_2_1_workbook_fixture.py
      - name: Explain failure class
        if: failure()
        run: |
          echo "## CI failure: recovered v3 compatibility" >> "$GITHUB_STEP_SUMMARY"
          echo "A historical source-track, parity, 3.2.1-R fixture, gate or recovered-economics invariant failed." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not weaken the test to restore green; classify the result as MATCH, DIFFERENCE or UNRESOLVED first." >> "$GITHUB_STEP_SUMMARY"

  release-integrity:
    name: "release / integrity and wheel smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned release tooling
        run: python -m pip install pytest==9.1.1 build==1.6.0
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-install built wheel in clean venv
        run: |
          python -m venv /tmp/glassbox-release-smoke
          /tmp/glassbox-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/glassbox-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import glassbox_auto
          assert version("glassbox-auto") == "0.2.0"
          print("wheel import/version smoke: PASS")
          PY
      - name: Compile package source
        run: python -m compileall -q src
      - name: Check release provenance and version
        run: python -m glassbox_auto.release_integrity --expected-version 0.2.0
      - name: Test release-integrity guard
        run: pytest -ra --tb=short tests/test_release_integrity.py
      - name: Explain failure class
        if: failure()
        run: |
          echo "## CI failure: release integrity" >> "$GITHUB_STEP_SUMMARY"
          echo "Wheel build/install, package version, compileability, or 3.2.1-R provenance guard failed." >> "$GITHUB_STEP_SUMMARY"
          echo "This is a release blocker even if scoring tests are green." >> "$GITHUB_STEP_SUMMARY"

  full-regression:
    name: "regression / full suite"
    runs-on: ubuntu-latest
    needs: [core-contracts, historical-compatibility, release-integrity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and pinned test runner
        run: python -m pip install -e . pytest==9.1.1
      - name: Run every test
        run: pytest -ra --tb=short
      - name: Publish green summary
        if: success()
        run: |
          echo "## GLASSBOX-AUTO CI: GREEN" >> "$GITHUB_STEP_SUMMARY"
          echo "Core contracts, recovered-v3 compatibility, release integrity and the complete regression suite passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Explain failure class
        if: failure()
        run: |
          echo "## CI failure: full regression" >> "$GITHUB_STEP_SUMMARY"
          echo "A test outside the classified suites failed or a cross-suite interaction regressed." >> "$GITHUB_STEP_SUMMARY"
